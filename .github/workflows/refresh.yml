name: Refresh dashboard

on:
  schedule:
    - cron: "30 12 * * *"  # 12:30 UTC = 6:00 PM IST (7:30 AM Central during daylight time, 6:30 AM in standard time)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull data from Zoho CRM
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ACCOUNTS_URL: ${{ vars.ZOHO_ACCOUNTS_URL }}
          ZOHO_API_DOMAIN: ${{ vars.ZOHO_API_DOMAIN }}
        run: |
          if [ -n "$ZOHO_CLIENT_ID" ] && [ -n "$ZOHO_CLIENT_SECRET" ] && [ -n "$ZOHO_REFRESH_TOKEN" ]; then
            python scripts/fetch_zoho.py --out site/data.js
          elif git fetch --depth=1 origin data-snapshot 2>/dev/null; then
            # Until the Zoho secrets are added, publish the one-off snapshot kept on the data-snapshot branch.
            git show FETCH_HEAD:data.js > site/data.js
            echo "::warning::Zoho secrets are not set, so the site shows the data-snapshot branch. Add ZOHO_CLIENT_ID, ZOHO_CLIENT_SECRET and ZOHO_REFRESH_TOKEN to refresh daily."
          else
            echo "::error::Add the ZOHO_CLIENT_ID, ZOHO_CLIENT_SECRET and ZOHO_REFRESH_TOKEN secrets (see README)."
            exit 1
          fi

      - name: Add the Box Byte batch file
        run: |
          # The latest Box Byte batch (drafted messages, held prospects, leads by profile) lives on its own
          # branch so prospect data never lands on main. Replace it when a new batch file arrives.
          if git fetch --depth=1 origin boxbyte-snapshot 2>/dev/null; then
            git show FETCH_HEAD:boxbyte.js > site/boxbyte.js
          else
            echo "::warning::No boxbyte-snapshot branch, so the Box Byte tab can't show the batch file."
          fi

      - name: Add the Medical Courier prospects sheet
        run: |
          # Courier outreach (emailed, followed up, replied per phase) comes from the prospects sheet, kept on
          # its own branch: only company names and outreach flags, no email addresses, phones or people.
          if git fetch --depth=1 origin courier-snapshot 2>/dev/null; then
            git show FETCH_HEAD:courier.js > site/courier.js
          else
            echo "::warning::No courier-snapshot branch, so the Medical Courier tab can't show email outreach."
          fi

      - name: Add the web-research people
        run: |
          # Decision makers found by web research for target accounts with no one else in Zoho: name, title,
          # company, public LinkedIn profile and source only. Kept on its own branch; Zoho records replace them once imported.
          if git fetch --depth=1 origin research-snapshot 2>/dev/null; then
            git show FETCH_HEAD:research.js > site/research.js
          else
            echo "::warning::No research-snapshot branch, so Warm Intros shows only people in Zoho."
          fi

      - name: Add the email history and LinkedIn sync
        run: |
          # Zoho contact IDs, dates and counts only (no names, addresses or message content): b2b_mail and
          # b2b_mail_weeks from the scheduled mail tasks, b2b_cal (meeting times from the team calendars) from the
          # scheduled calendar task, li_sync from Mack's LinkedIn export. Locked below.
          for pair in mail:mail.js cal:cal.js linkedin:linksync.js; do
            b="${pair%%:*}"; f="${pair##*:}"
            if git fetch --depth=1 origin "$b-snapshot" 2>/dev/null && git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              git show "FETCH_HEAD:$f" > "site/$f"
            else
              echo "::warning::No $f on the $b-snapshot branch, so B2B Today goes out without it."
            fi
          done

      - name: Add the sealed private datasets
        run: |
          # Email history and Mack's LinkedIn matches sit on their own branches sealed with scripts/seal.mjs (RSA public
          # key in scripts/seal_key.pub.pem); only the MAIL_KEY secret opens them, in the lock step below.
          for b in mail linkedin; do
            if git fetch --depth=1 origin "$b-snapshot" 2>/dev/null && git cat-file -e "FETCH_HEAD:$b.sealed.json" 2>/dev/null; then
              git show "FETCH_HEAD:$b.sealed.json" > "site/$b.sealed.json"
            fi
          done

      - name: Add the B2B Today and Quality Assurance tabs
        run: |
          # Source lives in artifact/ (shared with the private Claude Dashboard); the public page loads the same files.
          cp artifact/b2b-today.js artifact/b2b-today.css artifact/qa.js artifact/qa.css site/

      - name: Lock the data behind the team passcode
        env:
          DASH_PASSCODE: ${{ secrets.DASH_PASSCODE }}
          MAIL_KEY: ${{ secrets.MAIL_KEY }}
        run: |
          # Encrypts data.js, boxbyte.js, courier.js and research.js into data.lock.json and deletes the readable
          # files. Fails (and nothing is published) when the DASH_PASSCODE secret is missing or shorter than 16 characters.
          node scripts/lock_site.mjs site
          for f in data.js boxbyte.js courier.js research.js mail.js cal.js linksync.js mail.sealed.json linkedin.sealed.json; do
            if [ -e "site/$f" ]; then echo "::error::site/$f is still present"; exit 1; fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
