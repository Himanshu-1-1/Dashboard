name: Refresh dashboard

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 8:00 AM IST (9:30 PM Central the night before)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull data from Zoho CRM
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ACCOUNTS_URL: ${{ vars.ZOHO_ACCOUNTS_URL }}
          ZOHO_API_DOMAIN: ${{ vars.ZOHO_API_DOMAIN }}
        run: |
          if [ -n "$ZOHO_CLIENT_ID" ] && [ -n "$ZOHO_CLIENT_SECRET" ] && [ -n "$ZOHO_REFRESH_TOKEN" ]; then
            python scripts/fetch_zoho.py --out site/data.js
          elif git fetch --depth=1 origin data-snapshot 2>/dev/null; then
            # Until the Zoho secrets are added, publish the one-off snapshot kept on the data-snapshot branch.
            git show FETCH_HEAD:data.js > site/data.js
            echo "::warning::Zoho secrets are not set, so the site shows the data-snapshot branch. Add ZOHO_CLIENT_ID, ZOHO_CLIENT_SECRET and ZOHO_REFRESH_TOKEN to refresh daily."
          else
            echo "::error::Add the ZOHO_CLIENT_ID, ZOHO_CLIENT_SECRET and ZOHO_REFRESH_TOKEN secrets (see README)."
            exit 1
          fi

      - name: Add the Box Byte batch file
        run: |
          # The latest Box Byte batch (drafted messages, held prospects, leads by profile) lives on its own
          # branch so prospect data never lands on main. Replace it when a new batch file arrives.
          if git fetch --depth=1 origin boxbyte-snapshot 2>/dev/null; then
            git show FETCH_HEAD:boxbyte.js > site/boxbyte.js
          else
            echo "::warning::No boxbyte-snapshot branch, so the Box Byte tab can't show the batch file."
          fi

      - name: Add the Medical Courier prospects sheet
        run: |
          # Courier outreach (emailed, followed up, replied per phase) comes from the prospects sheet, kept on
          # its own branch: only company names and outreach flags, no email addresses, phones or people.
          if git fetch --depth=1 origin courier-snapshot 2>/dev/null; then
            git show FETCH_HEAD:courier.js > site/courier.js
          else
            echo "::warning::No courier-snapshot branch, so the Medical Courier tab can't show email outreach."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
